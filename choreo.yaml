apiVersion: v1
kind: Application
metadata:
  name: jira-time-log-dashboard
  version: v1
spec:
  type: web
  runtime: nodejs
  build:
    context: .
    dockerfile: Dockerfile
  resources:
    memory: 512Mi
    cpu: 0.5
  scaling:
    minReplicas: 1
    maxReplicas: 3
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3000"
    - name: JIRA_HOST
      valueFrom:
        secretKeyRef:
          name: jira-secrets
          key: JIRA_HOST
    - name: JIRA_EMAIL
      valueFrom:
        secretKeyRef:
          name: jira-secrets
          key: JIRA_EMAIL
    - name: JIRA_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: jira-secrets
          key: JIRA_API_TOKEN 